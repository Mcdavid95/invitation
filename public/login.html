<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<title>Sign in — Sealed</title>
</head>
<body class="auth">
<a class="brand" href="/">Sealed</a>
<form class="panel" id="auth" data-mode="login" novalidate>
  <h1>Sign in</h1>
  
  <label>Email<input name="email" type="email" autocomplete="email" required></label>
  <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
  
  <p class="error" role="alert"></p>
  <button class="button big" type="submit">Sign in</button>
  <p class="alt">New here? <a href="/signup">Create an account</a></p>
</form>
<script type="module" src="/assets/auth.js"></script>
</body>
</html>
