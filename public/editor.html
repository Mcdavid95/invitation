<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<title>Edit invitation — Sealed</title>
</head>
<body class="editor">
<header class="top">
  <a class="link" href="/dashboard">← Invitations</a>
  <strong id="title"></strong>
  <span id="status" role="status"></span>
  <nav>
    <button class="link" id="replay" type="button">Replay intro</button>
    <button class="button" id="publish" type="button" disabled>Publish</button>
  </nav>
</header>
<div id="banner" hidden></div>
<div class="work">
  <div class="pane" id="pane"><p class="muted">Loading…</p></div>
  <div class="stage"><div class="phone"><iframe id="preview" src="/demo?preview=1" title="Preview"></iframe></div></div>
</div>
<button class="button" id="toggle" type="button">Preview</button>
<script type="module" src="/assets/editor.js"></script>
</body>
</html>
